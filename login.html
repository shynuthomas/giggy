<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Local Escape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="page-body">
  <main class="auth-wrapper">
    <section class="auth-card">
      <div class="auth-head">
        <p class="eyebrow dark">SECURE ACCESS</p>
        <h1>Login to Local Escape</h1>
        <p>Use user login to book stays/events, or admin login to manage listings.</p>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <label>
          Login As
          <select id="role" required>
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </label>

        <label id="nameField">
          Full Name
          <input id="fullName" type="text" placeholder="Your name">
        </label>

        <label>
          Email
          <input id="email" type="email" placeholder="you@example.com" required>
        </label>

        <label>
          Password
          <input id="password" type="password" placeholder="Enter password" required>
        </label>

        <button class="primary-btn" type="submit">Login</button>
        <p id="loginMessage" class="form-message" role="status" aria-live="polite"></p>
      </form>

      <div class="help-box">
        <p><strong>Admin demo credentials</strong></p>
        <p>Email: <code>admin@localescape.com</code></p>
        <p>Password: <code>admin123</code></p>
      </div>

      <p class="auth-links">
        <a href="./index.html">Back to Home</a>
        <a href="./admin.html">Go to Admin Page</a>
      </p>
    </section>
  </main>

  <script src="./app-data.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
