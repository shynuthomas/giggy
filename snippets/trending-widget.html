<!-- Trending Study Materials Widget -->
<section id="trending-materials" class="trending-materials">
  <div class="tm-container">
    <div class="tm-header">
      <h2>Trending This Month</h2>
      <p>Most in-demand courses students are purchasing right now.</p>
    </div>
    <div id="tm-grid" class="tm-grid"></div>
  </div>
</section>

<style>
  .trending-materials { padding: 2rem 1rem; background: #f8fafc; }
  .tm-container { max-width: 1100px; margin: 0 auto; }
  .tm-header h2 { margin: 0 0 0.25rem; font-size: 1.7rem; }
  .tm-header p { margin: 0 0 1.5rem; color: #475569; }
  .tm-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1rem;
  }
  .tm-card {
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
  }
  .tm-card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    display: block;
  }
  .tm-card-body { padding: 0.9rem; }
  .tm-meta {
    font-size: 0.8rem;
    color: #64748b;
    margin-bottom: 0.5rem;
  }
  .tm-title {
    font-size: 1rem;
    margin: 0 0 0.6rem;
    color: #0f172a;
    min-height: 2.8rem;
  }
  .tm-stats {
    font-size: 0.85rem;
    color: #334155;
    margin-bottom: 0.75rem;
  }
  .tm-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .tm-price { font-weight: 700; color: #0f172a; }
  .tm-cta {
    background: #2563eb;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    padding: 0.45rem 0.7rem;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .tm-cta:hover { background: #1d4ed8; }
</style>

<script>
  (async function renderTrendingMaterials() {
    const grid = document.getElementById("tm-grid");
    if (!grid) return;

    try {
      const res = await fetch("/content/trending-materials.json");
      const data = await res.json();
      const materials = (data.materials || []).slice(0, 8);

      grid.innerHTML = materials.map((m) => `
        <article class="tm-card">
          <img src="${m.image_url}" alt="${m.title}" loading="lazy" />
          <div class="tm-card-body">
            <div class="tm-meta">${m.category} • ${m.level}</div>
            <h3 class="tm-title">${m.title}</h3>
            <div class="tm-stats">⭐ ${m.rating} • Trend Score: ${m.trend_score}</div>
            <div class="tm-footer">
              <span class="tm-price">${m.currency} ${Number(m.price).toFixed(2)}</span>
              <a class="tm-cta" href="${m.product_url}">Purchase & Start</a>
            </div>
          </div>
        </article>
      `).join("");
    } catch (error) {
      grid.innerHTML = "<p>Unable to load trending materials right now.</p>";
      console.error("Trending materials widget error:", error);
    }
  })();
</script>
